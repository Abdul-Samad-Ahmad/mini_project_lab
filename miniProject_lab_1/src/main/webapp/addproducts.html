<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <style>
    body {
      background-color: #f0f8ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .form-container {
      border: 3px solid maroon;
      border-radius: 15px;
      padding: 30px 40px;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 400px;
    }

    h2 {
      text-align: center;
      color: #ff5722;
      margin-bottom: 25px;
    }

    .form-row {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .form-row label {
      width: 130px;
      font-weight: bold;
    }

    .form-row input[type="text"] {
      flex: 1;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .submit-btn {
      width: 100%;
      background-color: #ff5722;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .submit-btn:hover {
      background-color: #e64a19;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Product Details</h2>
  <form action="add" method="post">
    <div class="form-row">
      <label>Product Code:</label>
      <input type="text" name="pcode" placeholder="enter product code">
    </div>
    <div class="form-row">
      <label>Product Name:</label>
      <input type="text" name="pname" placeholder="enter product name">
    </div>
    <div class="form-row">
      <label>Product Price:</label>
      <input type="text" name="pprice" placeholder="enter product price">
    </div>
    <div class="form-row">
      <label>Product Stock:</label>
      <input type="text" name="stock" placeholder="enter product stock">
    </div>
    <input type="submit" class="submit-btn" value="Submit">
  </form>
</div>

</body>
</html>
