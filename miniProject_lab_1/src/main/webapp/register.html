<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Clean Form</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --background-color: #ecf0f1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--background-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .registration-form {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 400px;
      margin: 1rem;
    }

    .form-logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 1rem;
      display: block;
    }

    .form-title {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      margin-bottom: 0.5rem;
      color: #7f8c8d;
      font-size: 0.9rem;
    }

    .form-input {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid #bdc3c7;
      border-radius: 5px;
      font-size: 0.9rem;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--secondary-color);
    }

    .form-button {
      width: 100%;
      padding: 0.7rem;
      background-color: var(--secondary-color);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      margin-top: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .form-button:hover {
      background-color: #2980b9;
    }

    .form-footer {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #7f8c8d;
    }

    .form-link {
      color: var(--secondary-color);
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .registration-form {
        padding: 1.5rem;
      }
      
      .form-title {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <form class="registration-form" action="RegisterServlet" method="post">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" 
         alt="Site Logo" 
         class="form-logo">

    <h1 class="form-title">Create Account</h1>

    <div class="form-group">
      <label class="form-label" for="FullName">Full Name</label>
      <input type="text" 
             id="FullName" 
             name="FullName"
             class="form-input" 
             placeholder="John Doe" 
             required>
    </div>

    <div class="form-group">
      <label class="form-label" for="Email">Email</label>
      <input type="email" 
             id="Email" 
             name="Email"
             class="form-input" 
             placeholder="john@example.com" 
             required>
    </div>

    <div class="form-group">
      <label class="form-label" for="Phno">Phone</label>
      <input type="tel" 
             id="Phno" 
             name="Phno"
             class="form-input" 
             placeholder="123-456-7890" 
             required>
    </div>

    <div class="form-group">
      <label class="form-label" for="Password">Password</label>
      <input type="password" 
             id="Password" 
             name="Password"
             class="form-input" 
             placeholder="••••••••" 
             minlength="8"
             required>
    </div>

    <!-- Added Confirm Password Field -->
    <div class="form-group">
      <label class="form-label" for="ConfirmPassword">Confirm Password</label>
      <input type="password" 
             id="ConfirmPassword" 
             name="ConfirmPassword"
             class="form-input" 
             placeholder="••••••••" 
             minlength="8"
             required>
    </div>

    <button type="submit" class="form-button">Register Now</button>

    <p class="form-footer">
      Have an account? 
      <a href="login.html" class="form-link">Sign In</a>
    </p>
  </form>
</body>
</html>
